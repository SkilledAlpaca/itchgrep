# Local, self-contained itchgrep stack.
#
#   docker compose up --build
#
# Use --build after ANY Go source change. Plain `docker compose up` reuses the
# previously built image and will silently run stale code.
#
# Brings up:
#   1. dataservice  - scrapes itch.io, builds the bleve index, publishes both
#   2. webserver    - http://localhost:62686 (starts immediately; serves 503
#                     until an index exists, then picks it up within ~5s)
#
# There is no separate bootstrap step. dataservice crawls on its own, the
# moment it starts, whenever no index has ever been published on the volume or
# the published one is older than CRAWL_INTERVAL - see scheduleCrawls in
# cmd/dataservice/main.go. A prior version of this file ran a one-shot
# "indexer" sidecar to kick off that first crawl; it was removed once
# scheduleCrawls grew the same CompareAndSwap guard against a double-start
# that the sidecar existed to route around.
#
# Both share the `itchgrep-data` volume, mounted at /data. That directory IS
# the storage layer: index.bleve/ plus the JSON files named in
# internal/storage/storage.go.
# There is no object store and no emulator - the previous fake-gcs-server
# container existed only to stand in for GCS, which this workload never needed
# (one writer, no ACLs, no listing, no lifecycle rules).
#
# The first run crawls the whole itch.io asset catalog (~108,000 assets) at a
# deliberately polite 2 requests/second, so expect about six hours. It cannot be
# done in one pass: itch.io serves at most 200 pages per browse view (~7,200
# assets), so the crawl walks many tag-filtered views and deduplicates. The
# first run also spends a few hundred requests discovering the tag universe,
# which is then cached as tags.json.
# Later runs reuse the volume and skip the crawl.
#
# Hand-trigger a re-crawl right now, without waiting for CRAWL_INTERVAL:
#
#   curl -X POST http://127.0.0.1:62685/trigger-fetch
#
# POST only, and bound to loopback on the host (see the dataservice ports:
# entry below) - it starts a multi-hour crawl with no further confirmation, so
# neither a stray GET nor another device on the LAN should be able to trigger
# it. To force a full re-index rather than the usual incremental crawl, either
# stop the stack, delete index.bleve/ from the volume (NOT the whole volume -
# that also throws away tags.json and checkpoint.json), and start it again; or
# just POST the trigger, since a crawl always rebuilds the index from scratch
# regardless of what is already published.
#
# Wipe data:  docker compose down -v
# Faster (at the cost of politeness):  SCRAPE_RPS=5 docker compose up

# Every long-running service below points its `logging:` at this.
#
# Docker's json-file driver keeps every line ever written unless told a limit,
# so without this the webserver's request log - one line per request, carrying
# a network-truncated client IP and a boolean for whether a query was present
# (never the raw query string) - accumulates on the host forever. 30 MB per
# service is now a hand-off buffer for scripts/export-logs.sh, the host-side
# follower that tails it into durable, rotated files - not the last stop for
# this data, just enough headroom that a follower outage of a few minutes
# cannot lose lines before it reconnects.
#
# Set here rather than in the daemon's config so the bound travels with the
# stack instead of depending on how the host was set up.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# restart: unless-stopped brings a service back after it exits for any reason
# other than an explicit `docker compose stop` - a crash, or the whole host
# rebooting. dataservice, webserver and cloudflared all carry it, because
# without it a reboot leaves cloudflared (which sets it independently of this
# file's convention) reconnecting the tunnel to an origin that never came back
# up, and the public site serves 502s while the tunnel dashboard reports
# healthy.
#
# Never add it to a one-shot container that is meant to run once and exit 0.
# Compose does not distinguish that from a crash for restart-policy purposes,
# so unless-stopped would restart it forever. This file used to define exactly
# such a container - a curl-based "indexer" sidecar that triggered the first
# crawl - which is why it never carried the policy; it no longer exists (see
# the header comment above), but the next one-shot job added here should stay
# just as bare.
services:
  dataservice:
    build:
      context: .
      dockerfile: Dockerfile.dataservice
    restart: unless-stopped
    # Pinned for the same reason as the webserver's container_name below:
    # scripts/export-logs.sh follows this container's logs by name too (into
    # crawler.log), and a project-name-derived default is one
    # COMPOSE_PROJECT_NAME rename away from breaking that follower silently.
    container_name: itchgrep-dataservice
    environment:
      # The storage directory. Everything the crawl produces lands here.
      DATA_DIR: /data
      PORT: "8080"
      # Rebuild the index whenever the published one is older than this. The
      # check is against the age of the data on disk, not a timer, so restarts
      # do not postpone it. Set to 0 to only ever crawl on /trigger-fetch.
      CRAWL_INTERVAL: "${CRAWL_INTERVAL:-168h}"
      # Outbound requests/second to itch.io, retries included. Fixed: a 429
      # pauses every worker for any Retry-After the server sent, but does not
      # change this rate.
      SCRAPE_RPS: "${SCRAPE_RPS:-2}"
      # Caps total pages fetched across every view. Unset means a full crawl.
      # Set it to a small number to smoke-test the whole pipeline in a couple
      # of minutes instead of about six hours. Produces a PARTIAL index, so
      # it also disarms COVERAGE_FLOOR and shrinks tag discovery to the
      # MAX_TAGS below - which is why MAX_TAGS itself is deliberately not set
      # here: a value pinned in this file's environment: block would take
      # precedence over that shrink from inside the container, and the smoke
      # test would spend ~17 minutes discovering tags before fetching a single
      # page of the partial run it was meant to finish in a couple of minutes.
      SCRAPE_MAX_PAGES: "${SCRAPE_MAX_PAGES:-}"
      # Stop crawling once this fraction of the catalog has been collected.
      # The last few percent costs disproportionately many requests.
      #
      # In practice this does not trigger: a full crawl exhausts every slice at
      # ~89%. It is an upper bound, so lowering it would end the crawl early
      # and index less. Leave it unless you deliberately want a shorter run.
      COVERAGE_TARGET: "${COVERAGE_TARGET:-0.95}"
      # Refuse to publish below this fraction, leaving the previous index in
      # place. Stops a stalled run replacing a good index with a worse one.
      #
      # Must sit BELOW what a healthy run actually reaches, or it rejects every
      # run. A full crawl currently measures ~89%: the union of tag views
      # cannot reach the rest, since assets carrying no tag in the discovered
      # vocabulary appear in no tag view at all. The code (cmd/dataservice)
      # defaults this to 0.75 - deliberately below the measured figure, so a
      # mildly degraded itch.io markup change does not block every publish -
      # and this variable is passed through only so it can still be set from
      # the environment for a smoke run (see SCRAPE_MAX_PAGES above, which
      # disarms this to 0 on its own; setting it here is for overriding the
      # floor outside of that).
      COVERAGE_FLOOR: "${COVERAGE_FLOOR:-0.75}"
      # Abandon a view once it stops yielding new assets, as a fraction of a
      # page. Assets appear in several views each, so without this the overlap
      # dominates the crawl.
      SLICE_MIN_YIELD: "${SLICE_MIN_YIELD:-0.05}"
      # MAX_TAGS (how many tags discovery may visit) is deliberately not set
      # here - see the SCRAPE_MAX_PAGES comment above. Setting it here would
      # always win over the code's own smoke-test shrink to 25, since the
      # code only applies that shrink when MAX_TAGS is unset in the process
      # environment. There is no pass-through line here, so exporting MAX_TAGS
      # in the shell or .env has NO effect on a compose run; if a production
      # run needs to override cmd/dataservice's default of 1000, add a
      # literal MAX_TAGS: "<value>" line to this block for that run and
      # remove it afterwards.
      # Rediscover the tag universe when the cached tags.json is older than this.
      TAG_CACHE_MAX_AGE: "${TAG_CACHE_MAX_AGE:-168h}"
      # Ignore a crawl checkpoint older than this. A checkpoint lets a run
      # killed part way through resume instead of restarting from zero.
      CHECKPOINT_MAX_AGE: "${CHECKPOINT_MAX_AGE:-24h}"
    ports:
      # Bound to loopback, not 0.0.0.0: /trigger-fetch takes no authentication
      # and starts a multi-hour crawl, so this port must not be reachable from
      # the LAN - only from the host itself. POST http://127.0.0.1:62685/trigger-fetch
      # to re-scrape (see the header comment above).
      - "127.0.0.1:62685:8080"
    volumes:
      # Both Dockerfiles now run as uid 65532 (distroless's :nonroot base
      # image - see the comment above FROM in Dockerfile.dataservice), not
      # root, so this mount must be writable by 65532 or every crawl fails
      # before it can write assets.json/tags.json/checkpoint.json or
      # index.bleve/. The images ship an empty /data owned by 65532 exactly
      # so that Docker seeds a fresh *named* volume with that ownership on
      # first use (see the COPY --chown in either Dockerfile). A
      # bind-mounted DATA_PATH (set as an env var - see .env.example) is
      # never chown'd automatically - on the host, once, before first `up`
      # with that path and again after upgrading an existing deployment onto
      # this nonroot image:
      #   chown -R 65532:65532 <DATA_PATH>
      # Skipping this on an upgrade is not a degraded mode - both services
      # fail to write and the webserver can never take the bleve lock.
      - "${DATA_PATH:-itchgrep-data}:/data"
    logging: *logging
    # Deliberately no healthcheck: stanza. Its only endpoint is the crawl
    # trigger, and there is no cheap liveness signal that does not also depend
    # on crawl outcome - a failed or slow crawl must not mark this container
    # unhealthy and restart-loop it mid-crawl, throwing away hours of progress
    # every time.

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.webserver
    restart: unless-stopped
    # Pinned rather than left to Compose's default "<project>-webserver-1"
    # naming: scripts/export-logs.sh follows this container's logs by name,
    # and a project-name-derived default is one COMPOSE_PROJECT_NAME rename
    # away from breaking that follower silently. The old "-1" suffix Compose
    # would otherwise append is gone for good, not just pinned to 1 - a
    # second webserver replica is not something this stack supports anyway.
    container_name: itchgrep-webserver
    environment:
      DATA_DIR: /data
      PAGE_SIZE: "36"
      PORT: "8080"
      # Read here only to say when the next rebuild is due. It must be the same
      # value the dataservice schedules from, or the masthead announces a
      # schedule nothing is running on - hence the shared variable rather than
      # two literals.
      CRAWL_INTERVAL: "${CRAWL_INTERVAL:-168h}"
      # Per-client request budget. A search is not cheap - three disjunctions,
      # two of them fuzzy, over ~86,000 documents - and nothing else in the
      # request path pushes back. Set RATE_LIMIT_RPS to 0 to disable.
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-5}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
      # Take the client IP from CF-Connecting-IP / X-Forwarded-For.
      #
      # Turn this on ONLY when something upstream (Cloudflare, nginx) sets those
      # headers, because they are otherwise attacker-controlled and any client
      # could mint a fresh identity per request to escape the limit. Behind a
      # proxy the inverse is true: leave it off and every visitor shares one
      # bucket, because every request arrives from the same address.
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
      # Peers CF-Connecting-IP / X-Forwarded-For are honored from. Empty
      # means trust nobody, which is the only safe default for a stack that
      # can also be reached with no Cloudflare in front of it at all - the
      # local-only `docker compose up`. The default here names cloudflared's
      # own pinned address on the compose network (see its `networks:` entry
      # below) as a single /32, not the whole subnet: the webserver's port is
      # published on the host's loopback only (see `ports:` below), and
      # Docker's userland proxy can deliver that traffic with the bridge gateway
      # as RemoteAddr - which sits inside the /24 - so trusting the whole subnet
      # would let anything that can reach the published port at all impersonate
      # a Cloudflare hop. Binding to loopback narrows who can reach it to
      # processes on the host, but this stays a /32: defense in depth, and the
      # same setting is used wherever the binding is changed.
      # A single address only ever matches the one peer that is actually
      # cloudflared.
      TRUSTED_PROXY_CIDRS: "${TRUSTED_PROXY_CIDRS:-172.30.99.10/32}"
    # Loopback only. Nothing public depends on this port: cloudflared reaches
    # the webserver over the compose network at http://webserver:8080. Bound to
    # 0.0.0.0 it exposed the origin to the whole LAN, past the Cloudflare WAF
    # and with proxy headers untrusted. Reach it from the host itself, e.g.
    # curl http://127.0.0.1:62686/healthz.
    ports:
      - "127.0.0.1:62686:8080"
    volumes:
      # Read-write, not read-only: bleve takes a lock file inside the index
      # directory when opening it, even for search-only use. And it must be
      # writable specifically by uid 65532 now that Dockerfile.webserver runs
      # as :nonroot rather than root - see the matching comment on
      # dataservice's volumes: entry above for the one-time host chown a
      # bind-mounted DATA_PATH needs.
      - "${DATA_PATH:-itchgrep-data}:/data"
    # Exec form, not a shell string: distroless has no shell to run it in, so
    # the check is the webserver binary's own "-healthcheck" flag, which GETs
    # its own /healthz and exits 0 or 1 (see cmd/webserver/main.go). This is
    # what cloudflared's `condition: service_healthy` below actually waits on.
    healthcheck:
      test: ["CMD", "/server", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # The service this bound exists for: internal/web/logmiddleware.go writes
    # a network-truncated client IP and a query-present boolean on every
    # request (internal/web/probes.go does the same, plus the full path, for
    # blocked scanner probes). This buffer is no longer the only place that
    # data is retained - scripts/export-logs.sh follows this container's
    # stdout on the host and appends it to rotated files under
    # LOG_EXPORT_DIR, so this 30 MB cap only has to survive the gap between a
    # request and the follower draining it.
    logging: *logging
    # Deliberately NOT gated on dataservice's first crawl finishing - there is
    # nothing here to gate on: dataservice starts crawling on its own and
    # nothing in this file waits for it. The webserver tolerates having no
    # data - it serves 503 and retries the load in the background - and it
    # re-checks storage per request (throttled to once every few seconds), so
    # it picks up a newly published index on its own.
    #
    # So on any run after the first it serves the PREVIOUS index immediately
    # while a re-scrape runs, then swaps atomically when the new one lands. A
    # prior version of this file gated webserver on a one-shot "indexer"
    # sidecar's completion instead; that bought nothing and cost an hour of
    # downtime per scrape, and made `docker compose up -d` block for the whole
    # crawl, because Compose cannot return until a service_completed_successfully
    # dependency finishes.

  # Public entrypoint for itchgrep.com. Opt-in, so a local `docker compose up`
  # never needs a Cloudflare account:
  #
  #   docker compose --profile public up -d
  #
  # A Tunnel dials OUT to Cloudflare and keeps the connection open, so there is
  # no port forward, no static IP, and the origin address never appears in DNS.
  # An open inbound port is the thing being avoided here - not just for secrecy,
  # but because a tunneled origin cannot be reached at all except through
  # Cloudflare, which is a much stronger property than a firewall rule.
  #
  # Route the tunnel's public hostname at http://webserver:8080 - the service
  # name, not localhost, since cloudflared resolves it on the compose network.
  #
  # NEVER route a hostname at the dataservice. `/trigger-fetch` takes no
  # authentication, so a public route to it — on any port — hands anyone a
  # button that starts a multi-hour crawl. Requiring POST (see
  # cmd/dataservice/main.go's handleFetchTrigger) stops a mere page load or a
  # scanner sweep from hitting it by accident, but that is not authentication
  # - a hostname routed here would still let any visitor who finds it fire the
  # button on purpose.
  cloudflared:
    # Pinned to a release tag + digest, not :latest: this container holds the
    # tunnel credential (TUNNEL_TOKEN below) and dials out to Cloudflare on
    # every start, so an unpinned :latest can swap in a new cloudflared build
    # under this stack with no review and no way to tell which version is
    # actually running. The tag is kept alongside the digest so a human
    # reading this line still sees the version without resolving the hash.
    # Refresh deliberately, never as a drive-by:
    #   docker buildx imagetools inspect cloudflare/cloudflared:latest
    # then confirm the new tag with:
    #   docker run --rm cloudflare/cloudflared:latest --version
    image: cloudflare/cloudflared:2026.10.4@sha256:c6c7ae1d5dfdcb094ad344ed68ccffc26635c9c6be80965664c33baf064b0515
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # From the Zero Trust dashboard when the tunnel is created. It is a
      # credential: keep it in .env, which is gitignored, never in this file.
      #
      # Defaulted rather than required (`:?`), because Compose interpolates
      # every service before it filters by profile - a required variable here
      # would break a plain local `docker compose up` for anyone who has no
      # tunnel. Unset, cloudflared exits immediately saying so.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    # condition: service_healthy, not the bare form - previously cloudflared
    # could start and route public traffic at a webserver container that
    # existed but had not actually bound its port yet. This waits on the
    # webserver's own healthcheck: stanza above instead.
    depends_on:
      webserver:
        condition: service_healthy
    logging: *logging
    # Fixed rather than left to Docker's DHCP-like allocation, so
    # TRUSTED_PROXY_CIDRS above can name this one address instead of the
    # whole /24: with a whole-subnet default, the bridge gateway (which
    # traffic through Docker's userland proxy can arrive from - see the
    # TRUSTED_PROXY_CIDRS comment on the webserver) and every other container on this network
    # would also be trusted to impersonate a Cloudflare hop. A /32 pointed at
    # this address is the actual "one peer cloudflared connects from" the ADR
    # describes.
    networks:
      default:
        ipv4_address: 172.30.99.10

volumes:
  itchgrep-data:

# Pinned instead of left to Docker's automatic allocation, so TRUSTED_PROXY_CIDRS
# above can name the exact address cloudflared connects from - the compose
# network's peer address is how the webserver decides whether to believe
# CF-Connecting-IP at all - rather than trusting whatever subnet Docker
# happened to hand out on this host, which can shift across a daemon restart
# or a second stack on the same machine.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.99.0/24
