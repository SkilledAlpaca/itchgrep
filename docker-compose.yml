# Local, self-contained itchgrep stack.
#
#   docker compose up --build
#
# Use --build after ANY Go source change. Plain `docker compose up` reuses the
# previously built image and will silently run stale code.
#
# Brings up:
#   1. dataservice  - scrapes itch.io, builds the bleve index, publishes both
#   2. indexer      - one-shot job: triggers the scrape, waits for the result
#   3. webserver    - http://localhost:8080 (starts immediately; serves 503
#                     until an index exists, then picks it up within ~5s)
#
# All three share the `itchgrep-data` volume, mounted at /data. That directory
# IS the storage layer: assets.json, tags.json, checkpoint.json and
# index.bleve/. There is no object store and no emulator - the previous
# fake-gcs-server container existed only to stand in for GCS, which this
# workload never needed (one writer, no ACLs, no listing, no lifecycle rules).
#
# The first run crawls the whole itch.io asset catalogue (~108,000 assets) at a
# deliberately polite 2 requests/second, so expect an hour or more. It cannot be
# done in one pass: itch.io serves at most 200 pages per browse view (~7,200
# assets), so the crawl walks many tag-filtered views and deduplicates. The
# first run also spends a few hundred requests discovering the tag universe,
# which is then cached as tags.json.
# Later runs reuse the volume and skip the crawl.
#
# Re-scrape:  FORCE_REINDEX=true docker compose up indexer
# Wipe data:  docker compose down -v
# Faster (at the cost of politeness):  SCRAPE_RPS=5 docker compose up

services:
  dataservice:
    build:
      context: .
      dockerfile: Dockerfile.dataservice
    environment:
      # The storage directory. Everything the crawl produces lands here.
      DATA_DIR: /data
      PORT: "8080"
      # Outbound requests/second to itch.io, retries included. Fixed: a 429
      # pauses every worker for any Retry-After the server sent, but does not
      # change this rate.
      SCRAPE_RPS: "${SCRAPE_RPS:-2}"
      # Caps total pages fetched across every view. Unset means a full crawl.
      # Set it to a small number to smoke-test the whole pipeline in a couple
      # of minutes instead of the better part of an hour. Produces a PARTIAL
      # index, so it also disarms COVERAGE_FLOOR and shrinks tag discovery.
      SCRAPE_MAX_PAGES: "${SCRAPE_MAX_PAGES:-}"
      # Stop crawling once this fraction of the catalogue has been collected.
      # The last few percent costs disproportionately many requests.
      #
      # In practice this does not trigger: a full crawl exhausts every slice at
      # ~80%. It is an upper bound, so lowering it would end the crawl early
      # and index less. Leave it unless you deliberately want a shorter run.
      COVERAGE_TARGET: "${COVERAGE_TARGET:-0.95}"
      # Refuse to publish below this fraction, leaving the previous index in
      # place. Stops a stalled run replacing a good index with a worse one.
      #
      # Must sit BELOW what a healthy run actually reaches, or it rejects every
      # run. A full crawl measures ~79.5% (86,414 of 108,697): the union of tag
      # views cannot reach the rest, since assets carrying no tag in the
      # discovered vocabulary appear in no tag view at all. 0.70 leaves room
      # for the catalogue to grow while still catching a genuinely stalled run.
      COVERAGE_FLOOR: "${COVERAGE_FLOOR:-0.70}"
      # Abandon a view once it stops yielding new assets, as a fraction of a
      # page. Assets appear in ~5 views each, so without this the overlap
      # dominates the crawl.
      SLICE_MIN_YIELD: "${SLICE_MIN_YIELD:-0.05}"
      # How many tags discovery may visit. One request each, so this is the
      # main cost of a cold start.
      MAX_TAGS: "${MAX_TAGS:-1000}"
      # Rediscover the tag universe when the cached tags.json is older than this.
      TAG_CACHE_MAX_AGE: "${TAG_CACHE_MAX_AGE:-168h}"
      # Ignore a crawl checkpoint older than this. A checkpoint lets a run
      # killed part way through resume instead of restarting from zero.
      CHECKPOINT_MAX_AGE: "${CHECKPOINT_MAX_AGE:-24h}"
    ports:
      - "8081:8080" # GET http://localhost:8081/trigger-fetch to re-scrape
    volumes:
      - itchgrep-data:/data

  # One-shot orchestration so `docker compose up` is the only command needed.
  indexer:
    image: curlimages/curl:latest
    depends_on:
      - dataservice
    environment:
      FORCE_REINDEX: "${FORCE_REINDEX:-false}"
    volumes:
      # Read-only: this container only needs to see whether the crawl has
      # published yet.
      - itchgrep-data:/data:ro
    entrypoint:
      - sh
      - -eu
      - -c
      - |
        ASSETS=/data/assets.json

        if [ "$${FORCE_REINDEX}" != "true" ] && [ -f "$${ASSETS}" ]; then
          echo "[indexer] assets.json already present, skipping scrape"
          exit 0
        fi

        echo "[indexer] waiting for dataservice..."
        until curl -s -o /dev/null http://dataservice:8080/; do sleep 2; done

        echo "[indexer] triggering itch.io scrape (~60-90 minutes at the default 2 req/s)"
        # 409 means a scrape is already running - that is fine, fall through
        # and poll for its result rather than failing.
        code=$$(curl -s -o /dev/null -w '%{http_code}' http://dataservice:8080/trigger-fetch)
        echo "[indexer] trigger returned HTTP $${code}"
        if [ "$${code}" != "200" ] && [ "$${code}" != "409" ]; then
          echo "[indexer] unexpected response from dataservice; check: docker compose logs dataservice"
          exit 1
        fi

        # The dataservice publishes the index first, then assets.json, so
        # assets.json appearing means the whole set is ready.
        elapsed=0
        limit=7200
        until [ -f "$${ASSETS}" ]; do
          if [ "$${elapsed}" -ge "$${limit}" ]; then
            echo "[indexer] timed out after $${limit}s; check: docker compose logs dataservice"
            exit 1
          fi
          sleep 15
          elapsed=$$((elapsed + 15))
          echo "[indexer] still scraping... $${elapsed}s elapsed"
        done

        echo "[indexer] data is on the volume, webserver will pick it up"

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.webserver
    environment:
      DATA_DIR: /data
      PAGE_SIZE: "36"
      PORT: "8080"
      # Per-client request budget. A search is not cheap - three disjunctions,
      # two of them fuzzy, over ~86,000 documents - and nothing else in the
      # request path pushes back. Set RATE_LIMIT_RPS to 0 to disable.
      RATE_LIMIT_RPS: "${RATE_LIMIT_RPS:-5}"
      RATE_LIMIT_BURST: "${RATE_LIMIT_BURST:-20}"
      # Take the client IP from CF-Connecting-IP / X-Forwarded-For.
      #
      # Turn this on ONLY when something upstream (Cloudflare, nginx) sets those
      # headers, because they are otherwise attacker-controlled and any client
      # could mint a fresh identity per request to escape the limit. Behind a
      # proxy the inverse is true: leave it off and every visitor shares one
      # bucket, because every request arrives from the same address.
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"
    ports:
      - "8080:8080"
    volumes:
      # Read-write, not read-only: bleve takes a lock file inside the index
      # directory when opening it, even for search-only use.
      - itchgrep-data:/data
    # Deliberately NOT gated on the indexer completing. The webserver tolerates
    # having no data - it serves 503 and retries the load in the background -
    # and it re-checks storage per request (throttled to once every few
    # seconds), so it picks up a newly published index on its own.
    #
    # So on any run after the first it serves the PREVIOUS index immediately
    # while a re-scrape runs, then swaps atomically when the new one lands.
    # Gating on the indexer bought nothing and cost an hour of downtime per
    # scrape - and made `docker compose up -d` block for the whole crawl,
    # because Compose cannot return until a service_completed_successfully
    # dependency finishes.

  # Public entrypoint for itchgrep.com. Opt-in, so a local `docker compose up`
  # never needs a Cloudflare account:
  #
  #   docker compose --profile public up -d
  #
  # A Tunnel dials OUT to Cloudflare and keeps the connection open, so there is
  # no port forward, no static IP, and the origin address never appears in DNS.
  # An open inbound port is the thing being avoided here - not just for secrecy,
  # but because a tunnelled origin cannot be reached at all except through
  # Cloudflare, which is a much stronger property than a firewall rule.
  #
  # Route the tunnel's public hostname at http://webserver:8080 - the service
  # name, not localhost, since cloudflared resolves it on the compose network.
  #
  # NEVER route a hostname at the dataservice on 8080/8081. `/trigger-fetch`
  # takes no authentication, so a public route to it hands anyone a button that
  # starts a multi-hour crawl.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # From the Zero Trust dashboard when the tunnel is created. It is a
      # credential: keep it in .env, which is gitignored, never in this file.
      #
      # Defaulted rather than required (`:?`), because Compose interpolates
      # every service before it filters by profile - a required variable here
      # would break a plain local `docker compose up` for anyone who has no
      # tunnel. Unset, cloudflared exits immediately saying so.
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - webserver

volumes:
  itchgrep-data:
