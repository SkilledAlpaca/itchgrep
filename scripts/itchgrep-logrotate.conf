# Rotation for the files scripts/export-logs.sh appends to.
#
# This file doubles as the install template: export-logs.sh copies it to
# /etc/logrotate.d/itchgrep on every array start (Unraid's /etc is a ramdisk,
# wiped on every boot). The path below is the literal LOG_EXPORT_DIR default;
# when LOG_EXPORT_DIR is overridden, export-logs.sh sed-replaces that literal
# with the live value before installing, so this checked-in copy stays
# byte-identical to what gets installed in the common (default-path) case.
#
# Deliberately NOT copytruncate. That would be the right answer for a follower
# holding a long-lived append fd, but export-logs.sh does not: its redirection
# (`printf ... >>"$FILE"`) sits inside the per-line read loop, so the file is
# opened by path, appended to, and closed once per line. Rename-and-create is
# therefore safe here - the very next line the follower writes lands in the
# freshly created file - and it avoids copytruncate's inherent race, where
# anything written between the copy and the truncate is lost outright.
#
# create fixes the mode explicitly rather than inheriting whatever umask the
# Unraid User Scripts entry happens to run under.
/mnt/user/appdata/itchgrep/logs/*.jsonl /mnt/user/appdata/itchgrep/logs/*.log {
    daily
    rotate 30
    compress
    missingok
    notifempty
    create 0640 root root
}
