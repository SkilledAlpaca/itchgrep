# Convenience wrappers. `docker compose up --build` is the supported way to run
# the stack and needs none of this.
#
# Every task here used to stand up a fake-gcs-server container, or deploy to
# Cloud Run. Storage is now a shared directory and there is no cloud
# deployment, so those tasks were removed rather than left in place broken.

version: "3"

vars:
  # Both services need to agree on this. It is the whole storage layer:
  # index.bleve/ plus the JSON files named in internal/storage/storage.go.
  DATA_DIR: '{{.DATA_DIR | default "./data"}}'

tasks:

  # --------------------------------
  #     LOCAL DEVELOPMENT
  # --------------------------------

  templ:
    desc: Generate .go files from .templ files
    cmds:
      - templ generate

  dataservice:
    desc: Run the dataservice; trigger a scrape with `task scrape`
    env:
      DATA_DIR: "{{.DATA_DIR}}"
      PORT: "8080"
    cmds:
      - go run ./cmd/dataservice

  webserver:
    desc: Run the webserver on localhost:8081
    deps: [templ]
    env:
      DATA_DIR: "{{.DATA_DIR}}"
      PAGE_SIZE: "36"
      PORT: "8081"
    cmds:
      - go run ./cmd/webserver

  scrape:
    desc: Trigger a scrape on a running dataservice
    cmds:
      # POST only: handleFetchTrigger rejects GET, since a state-changing,
      # unauthenticated endpoint answering GET is triggerable by a stray
      # <img src=...> on any page a browser on the same host loads.
      - curl -sS -X POST "localhost:8080/trigger-fetch" && echo

  smoke:
    desc: Exercise the whole pipeline in a couple of minutes against a scratch dir
    env:
      # A partial run, so it also disarms COVERAGE_FLOOR and shrinks tag
      # discovery. Deliberately not {{.DATA_DIR}}: the resulting index covers
      # ~1% of the catalog and must not replace a real one.
      DATA_DIR: "./data-smoke"
      SCRAPE_MAX_PAGES: "40"
      PORT: "8080"
    cmds:
      - defer: rm -rf ./data-smoke
      - go run ./cmd/dataservice &
      - sleep 3 && curl -sS -X POST "localhost:8080/trigger-fetch" && echo
      - wait

  # --------------------------------
  #     TESTING
  # --------------------------------

  test:
    desc: Run every test. Needs no running services.
    cmds:
      # -count=1 defeats Go's test cache: the pre-push check in
      # CONTRIBUTING.md requires a fresh run, and a cached "ok" from an
      # earlier tree would report a stale pass here.
      - go test ./... -count=1

  fmt:
    cmds:
      - go fmt ./...
      - go vet ./...
